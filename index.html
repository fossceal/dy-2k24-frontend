<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daksha Yanthra 25</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    />
    <style>
      @font-face {
        font-family: "Minercraftory";
        src: url("Minercraftory.ttf") format("truetype");
      }
      :root {
        --primary-color: #25d366;
        --accent-color: #833ab4;
        --gradient-1: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
        --gradient-2: linear-gradient(135deg, #12c2e9, #c471ed, #f64f59);
        --gradient-3: linear-gradient(135deg, #4158d0, #c850c0, #ffcc70);
        --text-primary: #ffffff;
        --text-secondary: #aaaaaa;
        --bg-dark: #0a0a0a;
        --bg-card: rgba(255, 255, 255, 0.05);
        --bg-card-hover: rgba(255, 255, 255, 0.1);
        --transition-fast: 0.3s ease;
        --transition-medium: 0.5s ease;
        --transition-slow: 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: var(--bg-dark);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* Background particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        opacity: 0.3;
        pointer-events: none;
      }

      /* Nav menu */
      .nav-menu {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        gap: 15px;
        align-items: center;
        opacity: 0;
        animation: navReveal 1s forwards;
        animation-delay: 4s;
      }

      .nav-link {
        color: var(--text-primary);
        text-decoration: none;
        padding: 8px 15px;
        border-radius: 20px;
        font-weight: 500;
        font-size: 0.9rem;
        transition: all var(--transition-fast);
        background: var(--bg-card);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .nav-link:hover {
        background: var(--bg-card-hover);
        transform: translateY(-2px);
      }

      /* Hero section enhancements */
      .hero-section {
        height: 100vh;
        position: relative;
        display: grid;
        gap: 10px;
        padding: 20px;
      }

      .hero-grid-item {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        opacity: 0;
        transform: translateY(50px) scale(1);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }

      .hero-grid-item:nth-child(1) {
        animation: gridRevealEnhanced 1.5s var(--transition-slow) forwards;
        animation-delay: 0.2s;
        background: var(--gradient-1);
      }

      .hero-grid-item:nth-child(2) {
        animation: gridRevealEnhanced 1.5s var(--transition-slow) forwards;
        animation-delay: 0.6s;
        background: var(--gradient-2);
      }

      .hero-grid-item:nth-child(3) {
        animation: gridRevealEnhanced 1.5s var(--transition-slow) forwards;
        animation-delay: 1s;
        background: var(--gradient-3);
      }

      .hero-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s var(--transition-medium);
        filter: brightness(0.8);
      }

      .hero-grid-item:hover .hero-image {
        transform: scale(1);
        filter: brightness(1);
      }

      .grid-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 30px;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0) 60%
        );
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        opacity: 0;
        transition: all 0.5s var(--transition-medium);
      }

      .hero-grid-item:hover .grid-overlay {
        opacity: 1;
      }

      .grid-title {
        font-size: 2rem;
        margin-bottom: 10px;
        font-weight: 700;
        transform: translateY(20px);
        opacity: 0;
        transition: all 0.5s var(--transition-medium);
        transition-delay: 0.1s;
      }

      .grid-subtitle {
        font-size: 1rem;
        color: var(--text-secondary);
        transform: translateY(20px);
        opacity: 0;
        transition: all 0.5s var(--transition-medium);
        transition-delay: 0.2s;
      }

      .hero-grid-item:hover .grid-title,
      .hero-grid-item:hover .grid-subtitle {
        transform: translateY(0);
        opacity: 1;
      }

      .grid-icon {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 2rem;
        opacity: 0;
        transform: translateY(-10px);
        transition: all 0.5s var(--transition-medium);
        transition-delay: 0.3s;
      }

      .hero-grid-item:hover .grid-icon {
        opacity: 0.8;
        transform: translateY(0);
      }

      /* Content wrapper enhancements */
      .content-wrapper {
        position: relative;
        padding: 40px 20px 60px;
        text-align: center;
        opacity: 0;
        animation: contentRevealEnhanced 0.5s ease-out forwards;
        animation-delay: 2s;
        overflow: hidden;
      }

      .content-wrapper::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          var(--text-secondary),
          transparent
        );
      }

      .title {
        font-family: "Minercraftory";
        font-size: 5rem;
        letter-spacing: 6px;
        margin-bottom: 1rem;
        text-transform: uppercase;
        background: var(--gradient-1);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
        transform: translateY(30px);
        animation: titleRevealEnhanced 0.7s ease-out forwards;
        animation-delay: 2.5s;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .subtitle {
        font-size: 2.5rem;
        color: var(--text-secondary);
        margin-bottom: 4rem;
        opacity: 0;
        animation: fadeInEnhanced 1s ease-out forwards;
        animation-delay: 3s;
        font-weight: 300;
        letter-spacing: 2px;
      }

      /* Contact section enhancements */
      .contact-section {
        max-width: 800px;
        margin: 0 auto 4rem;
        position: relative;
      }

      .section-title {
        font-size: 1.8rem;
        margin-bottom: 2rem;
        opacity: 0;
        animation: fadeInEnhanced 1s ease-out forwards;
        animation-delay: 3.1s;
        display: inline-block;
        /* background: var(--gradient-2); */
        background: white;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .contact-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .contact-item {
        font-size: 1.1rem;
        padding: 25px 20px;
        background: var(--bg-card);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: all var(--transition-fast);
        opacity: 0;
        transform: translateY(20px);
        animation: itemRevealEnhanced 0.8s ease-out forwards;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .contact-item:nth-child(1) {
        animation-delay: 3.2s;
      }
      .contact-item:nth-child(2) {
        animation-delay: 3.4s;
      }
      .contact-item:nth-child(3) {
        animation-delay: 3.6s;
      }

      .contact-item:hover {
        transform: translateY(-5px);
        background: var(--bg-card-hover);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }

      .contact-name {
        font-weight: 600;
        margin-bottom: 5px;
      }

      .contact-role {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-bottom: 10px;
      }

      .whatsapp-link {
        color: var(--primary-color);
        text-decoration: none;
        transition: color var(--transition-fast);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 500;
        padding: 8px 15px;
        margin: 0px auto;
        background: rgba(37, 211, 102, 0.1);
        border-radius: 8px;
        align-self: flex-start;
      }

      .whatsapp-link:hover {
        color: #1da851;
        background: rgba(37, 211, 102, 0.2);
      }

      /* Social media & footer enhancements */
      .social-section {
        margin-bottom: 4rem;
      }

      .social-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 2rem;
      }

      .social-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 35px;
        border-radius: 50px;
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: all var(--transition-fast);
        opacity: 0;
        animation: btnRevealEnhanced 1s ease-out forwards;
        position: relative;
        overflow: hidden;
        z-index: 1;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      .social-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        z-index: -1;
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .social-btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        opacity: 0.7;
        z-index: -2;
        filter: blur(15px);
      }

      .social-btn:hover {
        transform: translateY(-5px);
      }

      .social-btn:hover::before {
        transform: scale(1.1) rotate(-2deg);
      }

      .instagram-btn {
        background: linear-gradient(
          45deg,
          #405de6,
          #833ab4,
          #c13584,
          #e1306c,
          #fd1d1d
        );
        animation-delay: 3.8s;
      }

      .facebook-btn {
        background: #4267b2;
        animation-delay: 4s;
      }

      .youtube-btn {
        background: #ff0000;
        animation-delay: 4.2s;
      }

      .btn-icon {
        font-size: 1.2rem;
      }

      .footer {
        padding: 30px 0;
        text-align: center;
        opacity: 0;
        animation: fadeInEnhanced 1s ease-out forwards;
        animation-delay: 4.4s;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      /* Enhanced animations */
      @keyframes gridRevealEnhanced {
        0% {
          opacity: 0;
          transform: translateY(50px) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes contentRevealEnhanced {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes titleRevealEnhanced {
        0% {
          opacity: 0;
          transform: translateY(50px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes itemRevealEnhanced {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes btnRevealEnhanced {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInEnhanced {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes navReveal {
        0% {
          opacity: 0;
          transform: translateY(-20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Mobile responsiveness enhancements */
      @media (max-width: 992px) {
        .hero-section {
          grid-template-columns: 1fr;
          height: auto;
          gap: 15px;
          padding: 15px;
        }

        .hero-grid-item {
          height: 100%;
        }
        .contact-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .grid-title {
          font-size: 1rem;
          margin-bottom: 0px;
        }

        .grid-subtitle {
          font-size: 0.8rem;
        }

        .social-grid {
          flex-direction: column;
          align-items: center;
        }

        .title {
          font-size: 4rem;
        }
      }

      @media (max-width: 768px) {
        .hero-section {
          grid-template-columns: 1fr;
          height: auto;
          gap: 15px;
          padding: 15px;
        }

        .nav-menu {
          display: none;
        }

        .hero-grid-item {
          height: 100%;
        }

        .title {
          font-size: 2.5rem;
          letter-spacing: 3px;
        }

        .subtitle {
          font-size: 1.8rem;
          margin-bottom: 3rem;
        }

        .contact-grid {
          grid-template-columns: 1fr;
        }

        .nav-menu {
          top: 10px;
          right: 10px;
        }

        .nav-link {
          padding: 6px 12px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background particles -->

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Preload image
        const img = new Image();
        img.src = "reveal.png";
        img.onload = () => {
          document.body.classList.add("loaded");
        };

        // Background particles animation
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particle settings
        const particlesArray = [];
        const numberOfParticles = 100;

        class Particle {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3 + 1;
            this.speedX = Math.random() * 1 - 0.5;
            this.speedY = Math.random() * 1 - 0.5;
            this.color = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
          }

          update() {
            this.x += this.speedX;
            this.y += this.speedY;

            if (this.x > canvas.width || this.x < 0) {
              this.speedX = -this.speedX;
            }

            if (this.y > canvas.height || this.y < 0) {
              this.speedY = -this.speedY;
            }
          }

          draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function init() {
          for (let i = 0; i < numberOfParticles; i++) {
            particlesArray.push(new Particle());
          }
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
            particlesArray[i].draw();

            // Connect particles with lines
            for (let j = i + 1; j < particlesArray.length; j++) {
              const dx = particlesArray[i].x - particlesArray[j].x;
              const dy = particlesArray[i].y - particlesArray[j].y;
              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < 100) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255, 255, 255, ${
                  0.1 - distance / 1000
                })`;
                ctx.lineWidth = 0.2;
                ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                ctx.stroke();
              }
            }
          }
          requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          init();
        });

        init();
        animate();

        // Smooth scroll for navigation
        document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
          anchor.addEventListener("click", function (e) {
            e.preventDefault();

            document.querySelector(this.getAttribute("href")).scrollIntoView({
              behavior: "smooth",
            });
          });
        });
      });
    </script>
