<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DakshyaYanthra - Redirecting...</title>
    <meta name="description"
        content="We have moved! You are being redirected to our new domain at dakshayanthra.ceal.in.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dakshayanthra.in/">
    <meta property="og:title" content="DakshyaYanthra - We've Moved">
    <meta property="og:description"
        content="We have moved to a new domain. You are being redirected to dakshayanthra.ceal.in.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://dakshayanthra.in/">
    <meta property="twitter:title" content="DakshyaYanthra - We've Moved">
    <meta property="twitter:description"
        content="We have moved to a new domain. You are being redirected to dakshayanthra.ceal.in.">

    <!-- Redirect to the new domain -->
    <meta http-equiv="refresh" content="5; url=https://dakshayanthra.ceal.in/" />

    <!-- Fallback JavaScript redirect -->
    <script>
        setTimeout(function () {
            window.location.href = "https://dakshayanthra.ceal.in/";
        }, 5000);
    </script>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #111827;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        p {
            color: #4b5563;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        a:hover {
            background-color: #1d4ed8;
        }

        .loader {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="loader"></div>
        <h1>We've moved!</h1>
        <p id="countdown-text">You will be redirected to the new domain for DakshyaYanthra in <span id="time">5</span>
            seconds.</p>
        <script>
            let timeLeft = 5;
            const timeSpan = document.getElementById('time');
            setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) timeSpan.textContent = timeLeft;
            }, 1000);
        </script>
        <a href="https://dakshayanthra.ceal.in/">Click here if not redirected</a>
    </div>
</body>

</html>
